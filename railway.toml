[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
# Health check: Railway verifica este endpoint após o deploy
# Se não responder em 300s, considera o deploy falho e faz rollback
healthcheckPath = "/api/health"
healthcheckTimeout = 300
# Reinício automático em qualquer situação (crash ou saída normal)
restartPolicyType = "always"
restartPolicyMaxRetries = 10

[[services]]
name = "barber-pro-server"
